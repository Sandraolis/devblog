# trigger on every push
# main branch deploys to production
# dev branch deploys to staging
# run build checks before deployment (npm run build)
# run lint check before deployment (npm run lint)
# use environmental variables
# seperate configs for staging and production


name: Admin Dashboard CI/CD Pipeline

on:
  push:
    branches:
      - main
      - dev

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

jobs:
  test-lint-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

     # - name: Lint code
     #   run: npm run lint

     # - name: Run tests
      #  run: npm run test

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull Vercel Project Information (Staging) and build
        if: github.ref == 'refs/heads/dev'
        run: |
            vercel pull --yes --environment=preview --token=${{ secrets.VERCEL_TOKEN }}
            vercel build --token=${{ secrets.VERCEL_TOKEN }}

      - name: Pull Vercel Project Information (Production) and build
        if: github.ref == 'refs/heads/main'
        run: |
            vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
            vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: vercel-artifact
          path: .vercel/output

  deploy:
    needs: test-lint-build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download Build Artifact
        uses: actions/download-artifact@v4
        with:
          name: vercel-artifact
          path: .vercel/output

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Deploy Prebuilt Artifact to Vercel (Staging)
        if: github.ref == 'refs/heads/dev'
        run: vercel deploy --prebuilt --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy Prebuilt Artifact to Vercel (Production)
        if: github.ref == 'refs/heads/main'
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}